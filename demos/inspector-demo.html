<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inspector — interactive UI demo</title>
<!--
  Inspector — static UI demo.

  A self-contained, client-only reproduction of the Inspector desktop app's
  interface. No backend, no network, no real telemetry: every row is generated
  in the browser, and all hosts / endpoints / class names are fictional
  ("Contoso Live"). Drop it anywhere and embed it with:

      <iframe src="inspector-demo.html" style="width:100%;height:720px;border:0"></iframe>

  Everything below is vanilla HTML/CSS/JS — no framework, no build step.
-->
<style>
/* ── Fluent UI v9 webLightTheme tokens ───────────────────────────────────── */
:root {
  --bg1: #ffffff;
  --bg1Hover: #f5f5f5;
  --bg1Pressed: #e0e0e0;
  --bg2: #fafafa;
  --bg2Hover: #f0f0f0;
  --bg2Selected: #e6e6e6;
  --bg3: #f5f5f5;
  --bg3Hover: #ebebeb;
  --bg4: #f0f0f0;
  --bg6: #e6e6e6;
  --fg1: #242424;
  --fg2: #424242;
  --fg3: #616161;
  --fg4: #707070;
  --fgDisabled: #bdbdbd;
  --fgOnBrand: #ffffff;
  --stroke1: #d1d1d1;
  --stroke1Hover: #c7c7c7;
  --stroke2: #e0e0e0;
  --stroke3: #f0f0f0;
  --brandFg1: #0f6cbd;
  --brandFg2: #115ea3;
  --brandBg: #0f6cbd;
  --brandBgHover: #115ea3;
  --brandBg2: #ebf3fc;
  --brandStroke1: #0f6cbd;
  --brandStroke2: #b4d6fa;
  --green: #0e700e;
  --greenBg3: #107c10;
  --red: #b10e1c;
  --marigold: #eaa300;
  --r-sm: 2px;
  --r-md: 4px;
  --r-lg: 6px;
  --r-circ: 10000px;
  --shadow4: 0 0 2px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.14);
  --shadow8: 0 0 2px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.14);
  --shadow16: 0 0 2px rgba(0,0,0,.12), 0 8px 16px rgba(0,0,0,.14);
  --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
  --mono: 'Cascadia Mono', 'Consolas', 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: var(--font);
  background-color: var(--bg2);
  color: var(--fg1);
  overflow: hidden;
  font-size: 14px;
}

/* Thin scrollbars: the thumb is invisible at rest and only appears while the
   element is actively scrolling (the `is-scrolling` class is toggled globally)
   or while hovered, so scrollbars take no visual space while reading. */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: transparent; border-radius: 3px; }
.is-scrolling::-webkit-scrollbar-thumb { background: #c4c4c4; }
::-webkit-scrollbar-thumb:hover { background: #9a9a9a; }

/* Firefox has no ::-webkit-scrollbar; give its scroll containers the thin
   variant so they read the same, just without the auto-hide. */
@supports (scrollbar-width: thin) {
  .x-scroller, .x-detailbody, .x-popover, .x-menu, .x-rulelist, .x-mutelist, .x-payload {
    scrollbar-width: thin;
    scrollbar-color: #c4c4c4 transparent;
  }
}

button { font-family: inherit; }
input, select, textarea { font-family: inherit; }

/* ── App shell ───────────────────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; min-height: 0; background: var(--bg2); }
.x-body { flex: 1; display: flex; min-height: 0; min-width: 0; overflow: hidden; }
.x-tablewrap { flex: 1; min-width: 0; min-height: 0; display: flex; }

/* ── Generic Fluent-ish button ───────────────────────────────────────────── */
.f-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-width: 32px; height: 32px; padding: 0 12px;
  border: 1px solid var(--stroke1); border-radius: var(--r-md);
  background: var(--bg1); color: var(--fg1);
  font-size: 14px; font-weight: 600; line-height: 20px; cursor: pointer;
  white-space: nowrap;
}
.f-btn:hover { background: var(--bg1Hover); border-color: var(--stroke1Hover); }
.f-btn:active { background: var(--bg1Pressed); }
.f-btn[disabled] { color: var(--fgDisabled); background: var(--bg4); border-color: var(--stroke2); cursor: default; }
.f-btn[disabled] svg { opacity: .45; }
.f-btn.icon-only { padding: 0; width: 32px; }
.f-btn.primary { background: var(--brandBg); border-color: transparent; color: var(--fgOnBrand); }
.f-btn.primary:hover { background: var(--brandBgHover); }
.f-btn.primary[disabled] { background: var(--bg4); color: var(--fgDisabled); }
.f-btn.subtle { background: transparent; border-color: transparent; color: var(--fg2); }
.f-btn.subtle:hover { background: var(--bg1Hover); color: var(--fg1); }
.f-btn.subtle[disabled] { background: transparent; border-color: transparent; color: var(--fgDisabled); }
.f-btn.sm { height: 24px; min-width: 24px; padding: 0 8px; font-size: 12px; line-height: 16px; }
.f-btn.sm.icon-only { width: 24px; padding: 0; }
.f-btn.checked { background: var(--brandBg2); color: var(--brandFg1); }
.f-btn.checked:hover { background: var(--brandBg2); }
.f-btn svg { flex-shrink: 0; }

/* ── Generic Fluent-ish input ────────────────────────────────────────────── */
.f-input {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px; min-width: 0;
  background: var(--bg1); border: 1px solid var(--stroke1);
  border-bottom-color: var(--fg4);
  border-radius: var(--r-md);
}
.f-input.md { height: 32px; }
.f-input:focus-within { border-bottom: 2px solid var(--brandStroke1); padding-bottom: 0; }
.f-input > input {
  flex: 1; min-width: 0; border: none; outline: none; background: transparent;
  font-size: 12px; color: var(--fg1); padding: 0;
}
.f-input.md > input { font-size: 14px; }
.f-input > input::placeholder { color: var(--fg4); }

.f-select, .f-textarea {
  background: var(--bg1); border: 1px solid var(--stroke1); border-bottom-color: var(--fg4);
  border-radius: var(--r-md); color: var(--fg1); font-size: 12px; outline: none;
}
.f-select { height: 24px; padding: 0 6px; }
.f-textarea { padding: 5px 8px; font-family: var(--mono); font-size: 11px; resize: vertical; width: 100%; }

/* ── Fluent Switch ───────────────────────────────────────────────────────── */
.f-switch {
  position: relative; display: inline-flex; align-items: center; flex-shrink: 0;
  width: 40px; height: 20px; border-radius: var(--r-circ);
  border: 1px solid var(--fg3); background: transparent; padding: 0; cursor: pointer;
}
.f-switch::after {
  content: ""; position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%; background: var(--fg3);
  transition: left 100ms ease, background 100ms ease;
}
.f-switch:hover { border-color: var(--fg2); }
.f-switch:hover::after { background: var(--fg2); }
.f-switch[aria-checked="true"] { background: var(--brandBg); border-color: transparent; }
.f-switch[aria-checked="true"]::after { left: 23px; background: #fff; }
.f-switch[disabled] { border-color: var(--fgDisabled); cursor: default; }
.f-switch[disabled]::after { background: var(--fgDisabled); }
.f-switch[disabled][aria-checked="true"] { background: var(--fgDisabled); }
/* Armed chaos switch — marigold track instead of brand blue. */
.f-switch.armed[aria-checked="true"] { background: var(--marigold); }

/* ── Fluent Checkbox ─────────────────────────────────────────────────────── */
.f-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; color: var(--fg2); }
.f-check .box {
  width: 16px; height: 16px; border: 1px solid var(--fg3); border-radius: var(--r-sm);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.f-check[aria-checked="true"] .box { background: var(--brandBg); border-color: var(--brandBg); color: #fff; }
.f-check .box svg { display: none; }
.f-check[aria-checked="true"] .box svg { display: block; }

/* ── Divider ─────────────────────────────────────────────────────────────── */
.f-divider { height: 1px; background: var(--stroke2); border: 0; margin: 2px 0; }

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.x-topbar {
  display: flex; align-items: center; flex-wrap: wrap;
  column-gap: 8px; row-gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--stroke2); background: var(--bg1); flex-shrink: 0;
}
.x-mark { display: inline-flex; align-items: center; color: var(--brandFg1); flex-shrink: 0; cursor: default; user-select: none; }
.x-leftgroup { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }
.x-zone { display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0; }
.x-vdiv { width: 1px; height: 20px; background: var(--stroke2); flex-shrink: 0; margin: 0 2px; }
.x-minidiv { width: 1px; height: 16px; background: var(--stroke2); flex-shrink: 0; }
.x-filtergroup { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 260px; }
.x-searchbox { flex: 1; min-width: 180px; }
.x-contentafter { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.x-findnav { display: inline-flex; align-items: center; gap: 2px; }
.x-findcount { font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; white-space: nowrap; padding-right: 2px; }
.x-findnavbtn {
  display: inline-flex; align-items: center; justify-content: center;
  border: none; background: transparent; cursor: pointer; color: var(--fg2);
  padding: 2px; border-radius: var(--r-sm);
}
.x-findnavbtn:hover { background: var(--bg1Hover); }
.x-findnavbtn[disabled] { color: var(--fgDisabled); cursor: default; background: transparent; }

/* Segmented Logs | Both | Network */
.x-segmented {
  display: inline-flex; height: 28px; border: 1px solid var(--stroke1);
  border-radius: var(--r-md); overflow: hidden; flex-shrink: 0;
}
.x-segment {
  border: none; border-right: 1px solid var(--stroke2); background: transparent;
  padding: 0 10px; height: 100%; font-size: 12px; font-family: var(--font);
  color: var(--fg2); cursor: pointer; display: inline-flex; align-items: center;
}
.x-segment:last-child { border-right: none; }
.x-segment:hover { background: var(--bg1Hover); }
.x-segment.active { background: var(--brandBg2); color: var(--brandFg1); font-weight: 600; }
.x-segment.active:hover { background: var(--brandBg2); }

/* Capture button corner badge */
.x-capturebtn { position: relative; overflow: visible; }
.x-badge {
  position: absolute; top: -3px; right: -3px;
  min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px;
  border-radius: 999px; background: var(--brandBg); color: var(--fgOnBrand);
  font-size: 10px; font-weight: 600; line-height: 16px; font-variant-numeric: tabular-nums;
  display: inline-flex; align-items: center; justify-content: center;
  pointer-events: none; box-shadow: 0 0 0 1.5px var(--bg1);
}
.x-badge.armed { background: var(--marigold); color: var(--fg1); }
.x-badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; }

/* MCP on-dot */
.x-mcpwrap { position: relative; display: inline-flex; }
.x-mcpdot {
  position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%;
  background: var(--greenBg3); box-shadow: 0 0 0 1.5px var(--bg1); pointer-events: none; z-index: 1;
}

/* ── Table ───────────────────────────────────────────────────────────────── */
.x-table { flex: 1; display: flex; flex-direction: column; background: var(--bg1); min-width: 0; min-height: 0; position: relative; }
.x-headerviewport { flex-shrink: 0; overflow: hidden; }
.x-headerscroll { will-change: transform; }
.x-headerrow {
  display: flex; align-items: stretch; height: 26px;
  font-size: 10.5px; font-weight: 600; color: var(--fg3);
  text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 1px solid var(--stroke2); background: var(--bg2);
  user-select: none; flex-shrink: 0; padding-left: 8px;
}
.x-hcell { position: relative; display: flex; align-items: center; flex-shrink: 0; padding-left: 4px; }
.x-hcell.flex { flex: 1; min-width: 0; }
.x-hlabel { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 6px; cursor: pointer; flex: 1; min-width: 0; }
.x-hlabel.disabled { cursor: default; }
.x-sortglyph { font-size: 9px; margin-left: 2px; color: var(--fg2); }
.x-resize {
  position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
  cursor: col-resize; background: transparent; z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.x-resize::after { content: ""; width: 1px; height: 14px; background: var(--stroke2); transition: background-color 80ms, height 80ms; }
.x-resize:hover::after { background: var(--brandStroke1); height: 100%; }
.x-resize.dragging::after { background: var(--brandStroke1); height: 100%; width: 2px; }

.x-listwrap { flex: 1; min-height: 0; position: relative; }
.x-scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; }
.x-spacer { position: relative; width: 100%; }

.x-row {
  position: absolute; left: 0; display: flex; align-items: center;
  height: 28px; padding: 0 8px;
  font-family: var(--mono); font-size: 11.5px; cursor: pointer;
  border-bottom: 1px solid var(--stroke3);
}
.x-row:hover { background: var(--bg1Hover); }
.x-row.selected { background: var(--bg2Selected); }
.x-row.match { background: rgba(255,196,0,.16); }
.x-row.match.selected { background: rgba(255,196,0,.24); }
.x-row.activematch { background: rgba(255,196,0,.34); box-shadow: inset 2px 0 0 #d9a400; }

.x-cellwrap { display: flex; align-items: center; flex-shrink: 0; padding-left: 4px; min-width: 0; }
.x-cellwrap.flex { flex: 1; min-width: 0; }
.x-cell { padding-right: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.x-timecell { color: var(--fg3); }
.x-tagcell { color: #0050a4; }
.x-nettagcell { color: #038387; font-weight: 600; letter-spacing: .3px; }
.x-hexcell { color: var(--fg4); font-size: 11px; }
.x-sessioncell { color: var(--fg3); }
.x-sourcecell { color: #605e5c; }
.x-messagecell { color: var(--fg1); flex: 1; min-width: 0; }

.x-pill {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0 5px; height: 16px; min-width: 44px; border-radius: 3px;
  font-size: 9px; font-weight: 700; letter-spacing: .3px; border: 1px solid;
  font-family: var(--mono);
}

.x-markerrow {
  position: absolute; left: 0; display: flex; align-items: center; gap: 10px;
  height: 28px; padding: 0 12px; font-family: var(--mono); font-size: 11px;
  background: var(--bg3); border-top: 1px solid var(--brandStroke2); border-bottom: 1px solid var(--brandStroke2);
}
.x-markerlabel { color: var(--brandFg1); font-weight: 600; white-space: nowrap; flex-shrink: 0; }
.x-markerrule { flex: 1; height: 1px; background: var(--brandStroke2); }
.x-markertime { color: var(--fg3); white-space: nowrap; flex-shrink: 0; }
.x-runrow {
  position: absolute; left: 0; display: flex; align-items: center; gap: 10px;
  height: 28px; padding: 0 12px; font-family: var(--mono); font-size: 11px;
  color: var(--fg3); background: var(--bg2);
}
.x-runrule { flex: 1; height: 1px; background: var(--stroke2); }

.x-livepill {
  position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
  height: 28px; padding: 0 14px; border: none; border-radius: 14px;
  background: var(--brandBg); color: var(--fgOnBrand);
  font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .3px;
  cursor: pointer; box-shadow: var(--shadow8);
  display: inline-flex; align-items: center; gap: 6px; z-index: 4;
}

/* Row appended while pinned to the live tail gets a quiet opacity fade. */
@keyframes rowEnter { from { opacity: 0; } to { opacity: 1; } }
.row-entering { animation: rowEnter 160ms ease-out both; will-change: opacity; }

/* ── Empty state ─────────────────────────────────────────────────────────── */
.x-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--fg3); background: var(--bg1); padding: 32px; text-align: center;
}
.x-empty .glyph { font-size: 44px; margin-bottom: 16px; color: var(--brandFg1); user-select: none; }
.x-empty .heading { font-size: 18px; font-weight: 600; color: var(--fg1); margin-bottom: 8px; }
.x-empty .body { font-size: 13px; max-width: 460px; line-height: 1.5; }
.x-empty ul { font-size: 12px; margin-top: 20px; color: var(--fg3); text-align: left; max-width: 460px; line-height: 1.7; }
.x-empty code { font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 1px 4px; border-radius: 3px; }
.x-empty .cta { margin-top: 22px; display: flex; gap: 8px; }

.x-filteredhint {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  max-width: 440px; padding: 0 24px; text-align: center;
}
.x-filteredhint .heading { font-size: 14px; font-weight: 600; color: var(--fg2); }
.x-filteredhint .sub { font-size: 12px; color: var(--fg3); line-height: 1.4; }
.x-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 2px; }
.x-chip {
  display: inline-flex; align-items: center; gap: 5px;
  border: 1px solid var(--stroke1); border-radius: var(--r-md);
  background: var(--bg1); color: var(--fg2); font-size: 11.5px; font-family: var(--font);
  padding: 3px 8px; cursor: pointer;
}
.x-chip:hover { background: var(--bg1Hover); border-color: var(--stroke1Hover); }
.x-chip .xx { font-size: 10px; color: var(--fg3); }
.x-reset { border: none; background: transparent; color: var(--brandFg1); font-size: 11.5px; cursor: pointer; padding: 2px 4px; }
.x-reset:hover { text-decoration: underline; }
.x-note { font-size: 11px; color: var(--fg3); line-height: 1.4; margin-top: 4px; }

/* ── Details panel ───────────────────────────────────────────────────────── */
.x-detail {
  position: relative; display: flex; flex-direction: column;
  background: var(--bg1); border-left: 1px solid var(--stroke2);
  overflow: hidden; flex-shrink: 0;
}
.x-detailresize {
  position: absolute; top: 0; left: -4px; width: 8px; height: 100%;
  cursor: col-resize; background: transparent; z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.x-detailresize::after { content: ""; width: 1px; height: 24px; background: var(--stroke2); transition: background-color 80ms, height 80ms; }
.x-detailresize:hover::after, .x-detailresize.dragging::after { background: var(--brandStroke1); height: 100%; }
.x-detailhdr {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: 0 12px; border-bottom: 1px solid var(--stroke2); flex-shrink: 0; height: 40px;
}
.x-detailtitle { font-size: 13px; font-weight: 600; }
.x-detailactions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.x-detailbody { flex: 1; overflow-y: auto; scrollbar-gutter: stable; padding: 12px; font-size: 12px; position: relative; }
.x-field { display: grid; grid-template-columns: 108px 1fr; column-gap: 8px; row-gap: 4px; margin-bottom: 8px; align-items: baseline; }
.x-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--fg3); font-weight: 600; }
.x-value { font-family: var(--mono); color: var(--fg1); font-size: 11.5px; word-break: break-all; }
.x-sectiontitle {
  font-size: 11px; font-weight: 600; color: var(--fg3); text-transform: uppercase; letter-spacing: .5px;
  margin-bottom: 4px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;
}
.x-collapse { cursor: pointer; user-select: none; }
.x-collapse:hover { color: var(--fg2); }
.x-payloadwrap { position: relative; margin: 8px 0; }
.x-payload {
  font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere;
  background: var(--bg3); padding: 8px; border-radius: var(--r-md); color: var(--fg1);
  overflow: auto; max-height: 60vh; margin: 0;
}
.x-muterow { display: flex; gap: 6px; margin: 8px 0 4px; }
.x-urlvalue { font-family: var(--mono); font-size: 11.5px; color: var(--fg1); word-break: break-all; line-height: 1.45; }
.x-headertable { display: grid; grid-template-columns: minmax(90px, auto) 1fr; column-gap: 10px; row-gap: 3px; font-family: var(--mono); font-size: 11px; background: var(--bg3); padding: 8px; border-radius: var(--r-md); }
.x-hdrkey { color: var(--fg3); overflow-wrap: anywhere; }
.x-hdrval { color: var(--fg1); overflow-wrap: anywhere; }
.x-redacted { font-size: 10.5px; color: var(--fg3); margin-top: 6px; line-height: 1.4; }
.x-chaosbanner {
  display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; margin-bottom: 10px;
  background: #fff8e6; border: 1px solid var(--marigold); border-radius: var(--r-md);
}
.x-chaostitle { font-size: 11.5px; font-weight: 700; color: #8a5a00; letter-spacing: .3px; }
.x-chaosnote { font-size: 11px; color: #7a5200; line-height: 1.4; }
.x-partrow { border-top: 1px solid var(--stroke2); padding-top: 6px; margin-top: 6px; }
.x-partrow:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.x-partmeta { font-size: 10.5px; color: var(--fg3); margin-bottom: 4px; font-family: var(--mono); }

/* Hover-revealed copy affordances */
.copy-host { position: relative; }
.copy-host .copy-reveal {
  position: absolute; top: 6px; right: 8px; display: inline-flex; opacity: 0;

/* ── Formatters (ported from src/renderer/src/utils/formatters.ts) ───────── */
function formatTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleTimeString("en-US", { hour12: false }) + "." + String(d.getMilliseconds()).padStart(3, "0");
}
function formatDateTime(ts) {
  if (!ts) return "—";
  const d = new Date(ts);
  return d.toLocaleDateString("en-CA") + " " + d.toLocaleTimeString("en-US", { hour12: false }) + "." +
    String(d.getMilliseconds()).padStart(3, "0");
}
function truncateStr(s, max) { if (!s) return ""; return s.length <= max ? s : s.slice(0, max) + "…"; }
function shortSessionId(s) {
  if (!s) return "";
  if (s.startsWith("snapRequestID_")) return "snap:" + s.slice(14, 22);
  return s.slice(0, 8);
}
function prettyJson(v) { try { return JSON.stringify(v, null, 2); } catch { return String(v); } }
function prettyJsonText(t) { try { return JSON.stringify(JSON.parse(t), null, 2); } catch { return t; } }
function looksLikeJson(t) {
  const s = (t || "").trim();
  if (!s.length || (s[0] !== "{" && s[0] !== "[")) return false;
  try { JSON.parse(s); return true; } catch { return false; }
}
function formatBytes(n) {
  if (!Number.isFinite(n) || n < 0) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function escapeRegex(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

/* ── Random helpers (seeded so a reload looks familiar but not identical) ── */
let _seed = (Date.now() ^ 0x9e3779b9) >>> 0;
function rand() {
  _seed |= 0; _seed = (_seed + 0x6d2b79f5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(lo, hi) { return lo + Math.floor(rand() * (hi - lo + 1)); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }
function hex(n) { let s = ""; while (s.length < n) s += "0123456789abcdef"[Math.floor(rand() * 16)]; return s; }

function makeLogRow(ctx, ts) {
  const r = pick(LOG_RECIPES);
  const message = r.msg();
  let messageJson;
  const brace = message.indexOf("{");
  if (brace >= 0) { try { messageJson = JSON.parse(message.slice(brace)); } catch { /* leave undefined */ } }
  const idDec = 0x40000000 + rnd(1, 0x3ffffff);
  return {
    kind: "log",
    id: nextId("log"),
    documentId: ctx.documentId, runId: ctx.runId, runNumber: ctx.runNumber,
    sessionId: ctx.sessionId,
    uploadId: ctx.uploadId,
    capturedAt: ts, timestamp: ts,
    eventIdHex: "0x" + idDec.toString(16), eventIdDec: idDec,
    eventTag: rand() < 0.88 ? r.tag : undefined,
    category: r.cat, categoryName: r.catName,
    level: LEVEL_CODE[r.level], levelName: r.level, logType: 0,
    message, messageJson,
    source: r.src,
    correlationId: rand() < 0.35 ? guid() : undefined,
    endpoint: LOG_ENDPOINT,
    endpointHost: "liveapp.contoso.com",
    origin: ctx.origin || "live",

}

/**
 * A row recording a TLS connection to a host we never decrypted. All we observe is
 * the handshake, so `hostname` is the only real content: the URL is just the host,
 * there is no path, the status is 0 and the method is CONNECT — the tunnel the
 * client asked for. One row per connection, never per request.
 */
function makeUndecryptedRow(ctx, ts, hostname) {
  return {
    kind: "network",
    id: nextId("und"),
    documentId: ctx.documentId, runId: ctx.runId, runNumber: ctx.runNumber,
    timestamp: ts, capturedAt: ts,
    sessionId: undefined,
    origin: "live",
    netClass: UNDECRYPTED_CLASS,
    undecrypted: true,
    method: "CONNECT",
    url: "https://" + hostname,
    hostname,
    pathname: "",
    status: 0,
    statusText: "",
    contentType: "",
    contentLength: 0,
    durationMs: 0,
    requestHeaders: {},
    responseHeaders: {},
    redactedRequestHeaders: [],
    redactedResponseHeaders: [],
    requestBody: { kind: "empty" },
    body: { kind: "empty" },
  };
}

function makeNetRow(ctx, ts, forcedClass) {
  const netClass = forcedClass || pick(BUILTIN_CLASSES);
  const recipe = (NET_RECIPES[netClass] || NET_RECIPES.Asset)();
  const length = recipe.status === 304 ? 0 : recipe.length;
  const row = {
    kind: "network",
    id: nextId("net"),
    documentId: ctx.documentId, runId: ctx.runId, runNumber: ctx.runNumber,
    timestamp: ts, capturedAt: ts,
    sessionId: rand() < 0.85 ? ctx.sessionId : undefined,
    origin: ctx.origin || "live",
    netClass,
    method: recipe.method,
    url: "https://" + recipe.hostname + recipe.pathname + recipe.query,
    hostname: recipe.hostname,
    pathname: recipe.pathname,
    status: recipe.status,
    statusText: STATUS_TEXT[recipe.status] || "",
    contentType: recipe.contentType,
    contentLength: length,
    durationMs: recipe.dur,
    requestHeaders: {
      ":method": recipe.method,
      "accept": recipe.method === "POST" ? "application/json" : "*/*",
      "accept-encoding": "gzip, deflate, br",
      "origin": "https://liveapp.contoso.com",
      "referer": "https://liveapp.contoso.com/live/session.aspx",
      "user-agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) ContosoLive/7.42",
      "x-request-id": guid(),
    },
    responseHeaders: {
      "content-type": recipe.contentType,
      "content-length": String(length),
      "cache-control": recipe.status === 304 ? "public, max-age=31536000" : "no-store",
      "x-served-by": "edge-" + pick(["ams", "sea", "iad", "sin"]) + "-" + rnd(10, 99),
      "x-response-time": recipe.dur + "ms",
    },
    redactedRequestHeaders: ["authorization", "cookie"],
    redactedResponseHeaders: ["set-cookie"],
    requestBody: recipe.reqBody ? recipe.reqBody() : { kind: "empty" },
    body: recipe.status === 304 ? { kind: "empty" } : recipe.body(length),
  };
  return row;
}

const STATUS_TEXT = {
  200: "OK", 204: "No Content", 206: "Partial Content", 304: "Not Modified",
  400: "Bad Request", 401: "Unauthorized", 403: "Forbidden", 404: "Not Found",
  429: "Too Many Requests", 500: "Internal Server Error", 502: "Bad Gateway",
  503: "Service Unavailable", 504: "Gateway Timeout", 0: "Closed (chaos)",
};

/**
 * Apply an armed fault rule to a freshly-made network row, preserving the real
 * upstream response under `fault.original` exactly like the proxy does.
 */
function applyFaultToRow(row, rule) {
  const original = {
    status: row.status, statusText: row.statusText,
    contentType: row.contentType, contentLength: row.contentLength,
    responseHeaders: Object.assign({}, row.responseHeaders),
    redactedResponseHeaders: row.redactedResponseHeaders.slice(),
    body: row.body,
  };
  const notes = [];
  const blocked = rule.request && rule.request.action === "block";
  if (blocked) notes.push("request blocked");
  else if (rule.request) {
    if (rule.request.url) notes.push("redirected");
    if (rule.request.body) notes.push("req body " + rule.request.body.mode);
    if (rule.request.headers) notes.push("req headers " + rule.request.headers.mode);
  }

  if (rule.kind === "drop") {
    row.status = 0;
    row.statusText = "Closed (chaos)";
    row.contentLength = 0;
    row.body = { kind: "empty" };
    row.responseHeaders = {};
    notes.push("connection dropped");
  } else {
    if (rule.status != null) { notes.push("status " + original.status + " → " + rule.status); row.status = rule.status; row.statusText = STATUS_TEXT[rule.status] || ""; }
    if (rule.body) {
      if (rule.body.mode === "empty") { row.body = { kind: "empty" }; row.contentLength = 0; notes.push("body emptied"); }
      else if (rule.body.mode === "truncate") {
        const keep = Math.floor(row.contentLength / 2);
        const t = bodyText(row.body);
        if (t != null) {
          row.body = {
            kind: "text", subtype: "plain",
            text: t.slice(0, Math.max(40, Math.floor(t.length / 2))),
            truncated: { keptBytes: keep, totalBytes: row.contentLength },
          };
        } else if (row.body.kind === "multipart") {
          // Truncating a multipart body cuts it mid-stream, so the client sees
          // only the leading parts.
          const keepParts = Math.max(1, Math.floor(row.body.parts.length / 2));
          row.body = { kind: "multipart", subtype: row.body.subtype, parts: row.body.parts.slice(0, keepParts) };
        } else {
          row.body = { kind: "binary", contentType: row.contentType, sizeBytes: keep };
        }
        notes.push("body truncated " + formatBytes(original.contentLength) + " → " + formatBytes(keep));
        row.contentLength = keep;
      } else if (rule.body.mode === "replace") {
        row.body = { kind: "text", subtype: "plain", text: rule.body.text || "" };
        row.contentLength = (rule.body.text || "").length;
        notes.push("body replaced");
      }
    }
    if (rule.headers) {
      if (rule.headers.mode === "empty") { row.responseHeaders = {}; notes.push("headers emptied"); }
      else { row.responseHeaders = Object.assign({}, row.responseHeaders, rule.headers.entries || {}); notes.push("headers overridden"); }
    }
  }
  if (rule.delaySec) { row.durationMs += rule.delaySec * 1000; notes.push("delayed " + rule.delaySec + "s"); }

  row.fault = {
    ruleId: rule.id,
    note: notes.length ? notes.join("; ") : "faulted",
    blocked: blocked || undefined,
    sentUrl: rule.request && rule.request.url ? rule.request.url.url : undefined,
    original: blocked ? undefined : original,
  };
  return row;
}

/** Extract renderable text from a body union, or null when there is none. */
function bodyText(b) {
  if (!b) return null;
  if (b.kind === "json" || b.kind === "text") return b.text;
  return null;
}

/** The exact text rendered in the Category column for a captured row. */
function displayedCategory(row) {
  if (row.kind === "network") return row.netClass;
  return row.categoryName.startsWith("ulscat_")
    ? row.categoryName.slice("ulscat_".length) + " (" + row.category + ")"
    : String(row.category);
}
function oneLine(s) { return s.replace(/\s+/g, " ").trim(); }
function shortMethod(m) { return m === "OPTIONS" ? "OPT" : m; }
function networkSummary(r) { return r.pathname + " (" + formatBytes(r.contentLength) + ", " + r.durationMs + "ms)"; }

/**
 * What the Message column shows for a network row. An `Undecrypted` row records a
 * TLS connection, not a request, so there is no pathname, size or duration to
 * summarize — the hostname is the whole payload and the thing you'd act on.
 */
function networkMessage(r) {
  if (r.undecrypted) return r.hostname;
  const summary = networkSummary(r);
  return r.fault ? summary + " · " + r.fault.note : summary;
}

let _docSeq = 0;

/** One uniformly random animal title, re-rolled while it collides with an open tab. */
function nextCaptureTitle() {
  const taken = new Set(state.documents.map((d) => d.title));
  let title = "";
  for (let i = 0; i < TITLE_ATTEMPTS; i++) {
    const a = CAPTURE_ANIMALS[Math.floor(rand() * CAPTURE_ANIMALS.length)] || CAPTURE_ANIMALS[0];
    title = a[0] + " " + a[1];
    if (!taken.has(title)) break;
  }
  return title;
}

function createDocument(kind, title) {
  const auto = kind === "capture" && !title ? nextCaptureTitle() : null;
  const doc = {
    id: "doc-" + (++_docSeq),
    kind,
    title: title || auto || "Document",
    autoTitle: !!auto,
    autoName: auto || "",
    status: "idle",
    rows: [],
    runs: [],
    nextRun: 1,
    sessionId: hex(24),
    uploadId: rnd(1000, 9999),
    scrollTop: 0,
    markerSeq: 0,
  };
  state.documents.push(doc);
  return doc;
}

/**
 * Mute rules come in five kinds. `session` and `category` read fields that both
 * log and network rows carry, so those hide network rows too; `level`, `tag` and
 * `regex` are log-only.
 */
function compileMutes(rules) {
  const tags = new Set(), regexes = [], sessions = new Set(), categories = new Set(), levels = new Set();
  for (const r of rules) {
    if (!r.value) continue;
    if (r.kind === "tag") tags.add(r.value);
    else if (r.kind === "session") sessions.add(r.value);
    else if (r.kind === "category") categories.add(r.value);
    else if (r.kind === "level") levels.add(r.value);
    else if (r.kind === "regex") {
      // An invalid user-edited expression is inert rather than breaking the view.
      try { regexes.push(new RegExp(r.value, "i")); } catch { /* ignore */ }
    }
  }
  return {
    tags, regexes, sessions, categories, levels,
    any: tags.size > 0 || regexes.length > 0 || sessions.size > 0 || categories.size > 0 || levels.size > 0,

/* ═══════════════════════════════════════════════════════════════════════════

/* ── Markers ─────────────────────────────────────────────────────────────── */

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER LOOP
   ═════════════════════════════════════════════════════════════════════════ */

  const payload = {
    schemaVersion: 2,
    exportedAt: new Date().toISOString(),
    note: "Synthetic data from the Inspector UI demo — not real telemetry.",
    document: { id: doc.id, title: doc.title, kind: doc.kind, status: doc.status },
    runs: doc.runs,
    rows: doc.rows,

  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

  a.remove();

const MAX_REGEX_SOURCE_LEN = 400;
function isReservedLabel(label) {
  const l = label.trim().toLowerCase();
  if (l === UNDECRYPTED_CLASS.toLowerCase()) return true;
  return BUILTIN_CLASSES.some((c) => c.toLowerCase() === l);
}
function isLikelyCatastrophicRegex(src) {
  if (src.length > MAX_REGEX_SOURCE_LEN) return true;
  return /\([^)]*[+*][^)]*\)[+*]/.test(src);
}
function normalizeDomainInput(raw) {
  let s = String(raw || "").trim().toLowerCase();
  s = s.replace(/^[a-z]+:\/\//, "").replace(/\/.*$/, "").replace(/:\d+$/, "").replace(/\.$/, "");
  if (!s) return { error: "Enter a domain." };
  if (!/^[a-z0-9*.-]+$/.test(s)) return { error: "Only letters, digits, dots, hyphens and * are allowed." };
  if (!s.includes(".")) return { error: "That doesn't look like a domain." };
  return { value: s };
}
function hostMatchesGlob(host, glob) {
  const re = new RegExp("^" + glob.split("*").map(escapeRegex).join(".*") + "$", "i");
  return re.test(host);
}
function hostRuleFor(hostname) {
  return state.config.mitmHosts.find((h) => h.hostnames.some((g) => hostMatchesGlob(hostname, g)));

  const h = state.config.mitmHosts.find((x) => x.id === hostId);

    f.filter ? (f.filter.negate ? "not " : "") + "“" + f.filter.value + "” in " + f.filter.scopes.join("+") : null,
  ].filter(Boolean).join(" · ");
  const reqParts = [];
  if (f.request && f.request.action === "block") reqParts.push("block");
  else if (f.request) {
    if (f.request.url) reqParts.push("redirect");
    if (f.request.body) reqParts.push("req body");
    if (f.request.headers) reqParts.push("req headers");
  }
  let action;
  if (f.kind === "drop") action = "drop";
  else {
    const parts = [];
    if (f.status != null) parts.push("status " + f.status);
    if (f.body) parts.push(f.body.mode === "replace" ? "body replaced" : "body " + (f.body.mode === "empty" ? "emptied" : "truncated"));
    if (f.headers) parts.push(f.headers.mode === "empty" ? "headers emptied" : "headers overridden");
    action = parts.length ? parts.join(" + ") : "respond";
  }
  if (f.delaySec) action += " +" + f.delaySec + "s";
  const req = reqParts.length ? reqParts.join(" + ") + " → " : "";
  return f.targetClass + (narrow ? " · " + narrow : "") + " → " + req + action + " · " + Math.round(f.probability * 100) + "%";
}

function parseHeaderLines(text) {
  const out = {};
  for (const line of String(text || "").split(/\r?\n/)) {
    const i = line.indexOf(":");
    if (i <= 0) continue;
    const k = line.slice(0, i).trim();
    if (k) out[k] = line.slice(i + 1).trim();
  }
  return out;
}
function parsePercent(s) {
  const n = Number.parseFloat(s);
  if (!Number.isFinite(n)) return 1;
  const p = n / 100;
  return p < 0 ? 0 : p > 1 ? 1 : p;
}
function clampFaultStatus(n) { const v = Number.parseInt(n, 10); return Number.isFinite(v) ? Math.max(100, Math.min(599, v)) : DEFAULT_FAULT_STATUS; }
function clampDelaySec(n) { const v = Number.parseFloat(n); return Number.isFinite(v) ? Math.max(0, Math.min(300, v)) : 0; }

/** Categories a fault may target = built-ins + enabled Record-entry labels. */
function availableClasses() {
  const set = new Set(BUILTIN_CLASSES);
  for (const r of state.config.classificationRules) if (r.label && r.enabled) set.add(r.label);
  return Array.from(set);
}

/** Build the fault rule the draft currently describes. */
function composeDraftRule() {
  const d = state.drafts;
  const rule = {
    id: "f-" + hex(6),
    enabled: true,
    targetClass: d.faultClass,
    probability: parsePercent(d.faultProb),
    kind: d.faultKind,
  };
  if (d.faultUrl.trim()) {
    rule.filter = {
      value: d.faultUrl.trim(),
      scopes: FAULT_MATCH_SCOPES.filter((s) => d.filterScopes.includes(s)),
      negate: d.filterNegate || undefined,
    };
    if (!rule.filter.scopes.length) rule.filter.scopes = ["url"];
  }
  if (d.faultMethods.length) rule.methods = d.faultMethods.slice();
  const delay = clampDelaySec(d.faultDelay);
  if (delay) rule.delaySec = delay;

  const req = { action: d.reqAction };
  if (d.reqAction === "forward") {
    if (d.reqUrlMode === "replace" && d.reqUrl.trim()) req.url = { mode: "replace", url: d.reqUrl.trim() };
    if (d.reqHeaderMode === "empty") req.headers = { mode: "empty" };
    else if (d.reqHeaderMode === "override") req.headers = { mode: "override", entries: parseHeaderLines(d.reqHeaders) };
    if (d.reqBodyMode === "empty") req.body = { mode: "empty" };
    else if (d.reqBodyMode === "truncate") req.body = { mode: "truncate" };
    else if (d.reqBodyMode === "replace") req.body = { mode: "replace", text: d.reqBody };
  }
  rule.request = req;

  if (d.faultKind === "respond") {
    if (d.reqAction === "block") rule.status = clampFaultStatus(d.faultStatus);
    else if (d.statusMode === "set") rule.status = clampFaultStatus(d.faultStatus);
    if (d.headerMode === "empty") rule.headers = { mode: "empty" };
    else if (d.headerMode === "override") rule.headers = { mode: "override", entries: parseHeaderLines(d.faultHeaders) };
    if (d.bodyMode === "empty") rule.body = { mode: "empty" };
    else if (d.bodyMode === "truncate") rule.body = { mode: "truncate" };
    else if (d.bodyMode === "replace") rule.body = { mode: "replace", text: d.faultBody };
  }
  return rule;
}

}

/** Classify a pasted URL the way the proxy would, for the Test a URL box. */
function classifyTestUrl(raw) {
  let u;
  try { u = new URL(raw.trim()); } catch { return { cls: undefined, decrypted: false, bad: true }; }
  const host = u.hostname;
  const rule = hostRuleFor(host);
  const decrypted = !!(rule && rule.enabled);
  const p = u.pathname.toLowerCase();
  const on = (c) => state.config.builtinsEnabled[c] !== false;
  let cls;
  if (rule) {
    if (rule.id === "liveapp") {
      if (on("Thumbnail") && p.includes("getthumbnailurl.ashx")) cls = "Thumbnail";
      else if (on("Session") && p.includes("/session.aspx")) cls = "Session";
      else if (on("Items") && p.includes("/items")) cls = "Items";
    } else if (rule.id === "cdn") {
      if (on("Embed assets") && (p.includes("/files/") || p.includes("embed-"))) cls = "Embed assets";
      else if (on("Asset")) cls = "Asset";
    } else if (rule.id === "media" && on("Media") && p.includes("/transform")) cls = "Media";
    else if (rule.id === "drive" && on("Embed") && p.includes("/embed.aspx")) cls = "Embed";
    else if (rule.id === "calling" && on("Contoso Calling")) cls = "Contoso Calling";
  }
  if (!cls) {
    for (const r of state.config.classificationRules) {
      if (!r.enabled || !rule || r.hostId !== rule.id) continue;
      const v = (r.match.value || "").trim();
      if (!v) { cls = r.label; break; }
      if (r.match.kind === "regex") {
        try { if (new RegExp(v, "i").test(u.href)) { cls = r.label; break; } } catch { /* bad regex */ }
      } else if (u.href.toLowerCase().includes(v.toLowerCase())) { cls = r.label; break; }
    }
  }
  return { cls, decrypted };
}

/* ═══════════════════════════════════════════════════════════════════════════
   TABLE
   ═════════════════════════════════════════════════════════════════════════ */

const ROW_PAD_X = 16;
let suppressScrollEvents = false;
/** Mounted table rows, index → { node, sig }. Lets renderRowsOnly reuse nodes. */
let mountedRows = new Map();

function visibleColumns() { return COLUMN_DEFS.filter((c) => state.columnVisible[c.id]); }
function naturalRowWidth() {
  return visibleColumns().reduce((n, c) => n + state.columnWidths[c.id], 0) + ROW_PAD_X;
}
function isLiveCapturing() {
  return state.capture.liveDocumentId === state.activeDocumentId
    && (state.capture.status === "running" || state.capture.status === "starting");
}

function ensureTableEls() {
  if (tableEls.root && tableEls.docId === state.activeDocumentId) return;
  const headerScroll = el("div.x-headerscroll");
  const headerViewport = el("div.x-headerviewport", null, headerScroll);
  const spacer = el("div.x-spacer");
  const scroller = el("div.x-scroller", null, spacer);
  const listWrap = el("div.x-listwrap", null, scroller);
  const root = el("div.x-table", null, headerViewport, listWrap);

  scroller.addEventListener("scroll", () => {
    headerScroll.style.transform = "translateX(" + -scroller.scrollLeft + "px)";
    syncDockScrollbar();
    if (suppressScrollEvents) return;
    const max = scroller.scrollHeight - scroller.clientHeight;
    const atBottom = max - scroller.scrollTop <= 4;
    if (atBottom !== state.followingTail) { state.followingTail = atBottom; renderAll(); }
    else renderRowsOnly();
    scroller.classList.add("is-scrolling");
    clearTimeout(scroller._st);
    scroller._st = setTimeout(() => scroller.classList.remove("is-scrolling"), 900);
  }, { passive: true });

  // Shift+wheel (and horizontal wheel) scrolls the table sideways.
  scroller.addEventListener("wheel", (e) => {
    const raw = e.deltaX !== 0 ? e.deltaX : e.shiftKey ? e.deltaY : 0;
    if (raw === 0 || scroller.scrollWidth <= scroller.clientWidth) return;
    const max = scroller.scrollWidth - scroller.clientWidth;
    const next = Math.max(0, Math.min(max, scroller.scrollLeft + raw));
    if (next === scroller.scrollLeft) return;
    scroller.scrollLeft = next;
    if (e.shiftKey) e.preventDefault();
  }, { passive: false });

  Object.assign(tableEls, { root, headerScroll, header: null, scroller, spacer, listWrap, docId: state.activeDocumentId });
  mountedRows = new Map();
}

function renderTableRegion(doc) {
  const host = document.getElementById("region-table");
  const hasData = doc && doc.rows.some(isDataRow);

  if (!hasData) {
    tableEls.root = null; tableEls.scroller = null; tableEls.docId = null;
    mountedRows = new Map();
    clear(host);
    host.appendChild(renderEmptyState());
    return;
  }

  ensureTableEls();
  if (host.firstChild !== tableEls.root) { clear(host); host.appendChild(tableEls.root); }

  // Header
  clear(tableEls.headerScroll);
  tableEls.headerScroll.style.width = Math.max(naturalRowWidth(), tableEls.scroller.clientWidth || 0) + "px";
  tableEls.headerScroll.appendChild(renderHeaderRow());

  renderRowsOnly();

  // Live pill + filtered-empty hint live above the list.
  const old = tableEls.root.querySelectorAll(".x-livepill, .x-filteredhint");
  old.forEach((n) => n.remove());
  const rows = visibleRows();
  if (!rows.length) tableEls.root.appendChild(renderFilteredHint());
  if (!state.followingTail && rows.length > 0 && !state.spanZoom) {
    tableEls.root.appendChild(el("button.x-livepill", {
      type: "button",
      onclick: () => {
        state.followingTail = true;
        scrollToBottom();
        renderAll();
      },
    }, "↓ Live"));
  }
}

function scrollToBottom() {
  const s = tableEls.scroller;
  if (!s) return;
  suppressScrollEvents = true;
  s.scrollTop = s.scrollHeight - s.clientHeight;
  requestAnimationFrame(() => { suppressScrollEvents = false; });
}

function scrollRowIntoView(index, center) {
  const s = tableEls.scroller;
  if (!s) return;
  const target = center
    ? index * ROW_HEIGHT - s.clientHeight / 2 + ROW_HEIGHT / 2
    : index * ROW_HEIGHT;
  suppressScrollEvents = true;
  s.scrollTop = Math.max(0, Math.min(target, s.scrollHeight - s.clientHeight));
  requestAnimationFrame(() => { suppressScrollEvents = false; });
}

/** Re-render just the visible window — the hot path during scroll.
 *
 *  Rows are reused rather than rebuilt: a node whose signature is unchanged is
 *  left in the DOM untouched. That keeps node identity stable across the ~3/sec
 *  streaming re-renders, so a click that straddles a batch still lands (a
 *  rebuilt node would drop the click, since mousedown and mouseup would hit
 *  different elements). */
function renderRowsOnly() {
  const s = tableEls.scroller;
  if (!s) return;
  const rows = visibleRows();
  const cols = visibleColumns();
  const rowWidth = Math.max(naturalRowWidth(), s.clientWidth || 0);

  tableEls.spacer.style.height = rows.length * ROW_HEIGHT + "px";
  tableEls.spacer.style.width = rowWidth + "px";
  tableEls.headerScroll.style.width = rowWidth + "px";

  const matches = findMatchIndexes(rows);
  const matchSet = matches.length ? new Set(matches) : null;
  const activeIdx = matches.length ? matches[Math.min(state.findActiveIndex, matches.length - 1)] : -1;

  if (state.followingTail && !suppressScrollEvents) {
    const max = s.scrollHeight - s.clientHeight;
    if (max - s.scrollTop > 4) { suppressScrollEvents = true; s.scrollTop = max; requestAnimationFrame(() => { suppressScrollEvents = false; }); }
  }

  const viewH = s.clientHeight || 400;
  const first = Math.max(0, Math.floor(s.scrollTop / ROW_HEIGHT) - OVERSCAN);
  const last = Math.min(rows.length, Math.ceil((s.scrollTop + viewH) / ROW_HEIGHT) + OVERSCAN);

  const colKey = cols.map((c) => c.id + ":" + state.columnWidths[c.id]).join(",");
  const needed = new Set();

  for (let i = first; i < last; i++) {
    needed.add(i);
    const row = rows[i];
    const sig = [
      row.id, i, rowWidth, colKey,
      row.id === state.selectedEventId ? 1 : 0,
      matchSet && matchSet.has(i) ? 1 : 0,
      i === activeIdx ? 1 : 0,
      freshIds.has(row.id) ? 1 : 0,
    ].join("|");
    const cur = mountedRows.get(i);
    if (cur && cur.sig === sig) continue;
    const node = renderRow(row, i, cols, rowWidth, matchSet, activeIdx);
    if (cur) {
      cur.node.replaceWith(node);
    } else {
      // Insert in index order so DOM order tracks visual order (tab order,
      // querySelector determinism) even though rows are absolutely positioned.
      let ref = null;
      for (let j = i + 1; j < last; j++) {
        const m = mountedRows.get(j);
        if (m) { ref = m.node; break; }
      }
      tableEls.spacer.insertBefore(node, ref);
    }
    mountedRows.set(i, { node, sig });
  }

  for (const [i, m] of Array.from(mountedRows)) {
    if (!needed.has(i)) { m.node.remove(); mountedRows.delete(i); }
  }
}

function renderRow(row, index, cols, rowWidth, matchSet, activeIdx) {
  const top = index * ROW_HEIGHT + "px";
  const entering = freshIds.has(row.id) ? " row-entering" : "";

  if (row.kind === "marker") {
    return el("div", {
      class: "x-markerrow" + entering,
      style: { top, width: rowWidth + "px" },
      oncontextmenu: (e) => { e.preventDefault(); openRowMenu(row, e.clientX, e.clientY); },
    },
      el("span.x-markerlabel", null, "◆ " + row.label),
      el("span.x-markerrule"),
      el("span.x-markertime", null, formatTime(row.timestamp)));
  }

  if (row.kind === "run-boundary") {
    return el("div", { class: "x-runrow", style: { top, width: rowWidth + "px" } },
      el("span", null, "Run " + row.runNumber + " · " + (row.truncated ? "earlier rows truncated" : "continued " + formatTime(row.timestamp))),
      el("span.x-runrule"));
  }

  const selected = row.id === state.selectedEventId;
  const isMatch = matchSet && matchSet.has(index);
  const isActive = index === activeIdx;
  const cls = ["x-row"];
  if (isMatch) cls.push("match");
  if (selected) cls.push("selected");
  if (isActive) cls.push("activematch");

  const node = el("div", {
    class: cls.join(" ") + entering,
    style: { top, width: rowWidth + "px" },
    onclick: () => {
      state.selectedEventId = state.selectedEventId === row.id ? undefined : row.id;
      state.detailFind = { open: false, text: "", index: 0 };
      renderAll();
    },
    oncontextmenu: (e) => { e.preventDefault(); openRowMenu(row, e.clientX, e.clientY); },
  });
  for (const col of cols) {
    node.appendChild(el("div.x-cellwrap", { style: { width: state.columnWidths[col.id] + "px" } }, col.render(row)));
  }
  return node;
}

function renderHeaderRow() {
  const cols = visibleColumns();
  const sortDisabled = isLiveCapturing();
  const rowEl = el("div.x-headerrow");
  for (const col of cols) {
    const active = state.sort && state.sort.columnId === col.id;
    const glyph = active ? (state.sort.direction === "asc" ? "▲" : "▼") : "";
    const cell = el("div.x-hcell", { style: { width: state.columnWidths[col.id] + "px" } },
      el("div", {
        class: "x-hlabel" + (sortDisabled ? " disabled" : ""),
        title: sortDisabled ? "Sorting is disabled during live capture — Stop first" : "Sort by " + col.label,
        onclick: sortDisabled ? null : () => {
          if (!active) state.sort = { columnId: col.id, direction: "asc" };
          else if (state.sort.direction === "asc") state.sort = { columnId: col.id, direction: "desc" };
          else state.sort = undefined;
          if (state.sort) state.spanZoom = false;
          renderAll();
        },
      }, col.label, glyph ? el("span.x-sortglyph", null, glyph) : null),
      el("div.x-resize", {
        onpointerdown: (e) => startColumnResize(e, col),
      }));
    rowEl.appendChild(cell);
  }
  return rowEl;
}

function startColumnResize(e, col) {
  e.preventDefault();
  const handle = e.currentTarget;
  handle.classList.add("dragging");
  const startX = e.clientX;
  const startW = state.columnWidths[col.id];
  const move = (ev) => {
    state.columnWidths[col.id] = Math.max(col.minWidth, startW + (ev.clientX - startX));
    renderTableRegion(activeDoc());
  };
  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    handle.classList.remove("dragging");
    renderAll();
  };
  document.addEventListener("pointermove", move);
  document.addEventListener("pointerup", up);
}

/* ── Row context menu ────────────────────────────────────────────────────── */
function openRowMenu(row, x, y) {
  openOverlay("rowmenu", { left: x, right: x, top: y, bottom: y, width: 0, height: 0 }, { row, align: "start" });
}
OVERLAYS.rowmenu = (o) => {

  } else {

};

function renderEmptyState() {

          const d = createDocument("har", "sample-session.har");

}

function renderFilteredHint() {
  const active = [];
  if (state.rowKindFilter !== "both") {
    active.push({ key: "kind", label: "Showing " + (state.rowKindFilter === "logs" ? "Logs" : "Network") + " only", clear: () => { state.rowKindFilter = "both"; renderAll(); } });
  }

  }
  if (state.muteRules.length) {

  }

        : null,
    ] : el("div.sub", null, "Nothing to display right now."));
}

/* ── Dock horizontal scrollbar sync ──────────────────────────────────────── */
let dockBar = null;
function syncDockScrollbar() {
  const s = tableEls.scroller;
  if (!dockBar || !s || !dockBar.track.isConnected) return;
  const trackW = dockBar.track.clientWidth;
  if (!trackW) return;
  const range = s.scrollWidth - s.clientWidth;
  if (range <= 1) return;
  const thumbW = Math.max(24, Math.round(trackW * (s.clientWidth / s.scrollWidth)));
  const travel = Math.max(0, trackW - thumbW);
  dockBar.thumb.style.width = thumbW + "px";
  dockBar.thumb.style.left = Math.round((s.scrollLeft / range) * travel) + "px";
}

/** Click-to-copy value. Plain click copies; the hover tint is the affordance. */
function copyable(value, children, cls) {
  return el("span", {
    class: "copyable" + (cls ? " " + cls : ""),
    title: "Click to copy",
    onclick: (e) => { e.stopPropagation(); copyText(value, "Copied"); },

function payloadBlock(text) {

function detectMessageFormat(message) {
  const t = (message || "").trim();
  if (looksLikeJson(t)) { try { return { kind: "json", value: JSON.parse(t) }; } catch { /* fall through */ } }
  const i = t.indexOf("{");
  if (i > 0) {
    const tail = t.slice(i);
    if (looksLikeJson(tail)) { try { return { kind: "prefix-json", prefix: t.slice(0, i).trim(), value: JSON.parse(tail) }; } catch { /* fall through */ } }
  }
  return { kind: "plain" };
}
function messageSectionLabel(f) {
  return f.kind === "json" ? "(parsed JSON)" : f.kind === "prefix-json" ? "(prefix + JSON)" : "";
}

/** Section open state, keyed per row; a Find hit forces its section open. */
function sectionOpen(rowId, id, defaultOpen, searchable) {
  const key = rowId + ":" + id;
  const q = state.detailFind.open ? state.detailFind.text.trim().toLowerCase() : "";
  if (q && searchable && searchable.toLowerCase().includes(q)) return true;
  return state.sections[key] === undefined ? defaultOpen : state.sections[key];
}
function toggleSection(rowId, id, defaultOpen) {
  const key = rowId + ":" + id;
  const cur = state.sections[key] === undefined ? defaultOpen : state.sections[key];
  state.sections[key] = !cur;
  renderAll();
}

function collapsibleTitle(rowId, id, title, open, defaultOpen, meta) {
  return el("div.x-sectiontitle.x-collapse", {
    onclick: () => toggleSection(rowId, id, defaultOpen),
    role: "button", tabindex: "0",
    onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleSection(rowId, id, defaultOpen); } },
  },
    el("span", { style: { display: "inline-flex", alignItems: "center", gap: "5px" } },
      el("span", { html: ICON.chevRight, style: { display: "inline-flex", transform: open ? "rotate(90deg)" : "none", transition: "transform 120ms" } }),
      title),
    meta ? el("span", { style: { fontWeight: "400", textTransform: "none", letterSpacing: "0", color: "var(--fg4)" } }, meta) : null);
}

function headerSection(rowId, id, title, headers, redacted) {
  const keys = Object.keys(headers || {});
  const searchable = keys.map((k) => k + " " + headers[k]).join("\n");
  const open = sectionOpen(rowId, id, id === "res-headers", searchable);
  const out = [collapsibleTitle(rowId, id, title, open, id === "res-headers", keys.length + (keys.length === 1 ? " header" : " headers"))];
  if (open) {
    out.push(keys.length
      ? el("div.x-headertable", null, keys.map((k) => [
          el("span.x-hdrkey", null, k),
          copyable(headers[k], headers[k], "x-hdrval"),
        ]))
      : el("div.x-hint", { style: { padding: "6px 0" } }, "No headers."));
    if (redacted && redacted.length) {

}

function bodyTypeMeta(body, contentType) {
  if (!body) return "";
  switch (body.kind) {
    case "empty": return "empty";
    case "json": return "json · " + formatBytes(new Blob([body.text]).size);
    case "text": return body.subtype + " · " + formatBytes(new Blob([body.text]).size);
    case "binary": return "binary · " + formatBytes(body.sizeBytes);
    case "multipart": return "multipart/" + body.subtype + " · " + body.parts.length + (body.parts.length === 1 ? " part" : " parts");
    case "omitted": return "not captured (" + body.reason + ") · " + formatBytes(body.sizeBytes);
    case "unavailable": return "unavailable · " + formatBytes(body.sizeBytes);
    default: return contentType || "";
  }
}

function bodySearchable(body) {
  if (!body) return "";
  if (body.kind === "json" || body.kind === "text") return body.text;
  if (body.kind === "multipart") return body.parts.map((p) => (p.name || "") + " " + (p.text || "")).join("\n");
  return "";

function renderBodyContent(body, contentType) {
  if (!body || body.kind === "empty") return el("div.x-hint", { style: { padding: "6px 0" } }, "No body.");
  if (body.kind === "json") return [payloadBlock(prettyJsonText(body.text)), truncNote(body.truncated)];
  if (body.kind === "text") {
    const text = looksLikeJson(body.text) ? prettyJsonText(body.text) : body.text;
    return [payloadBlock(text), truncNote(body.truncated)];
  }
  if (body.kind === "binary") return el("div.x-hint", { style: { padding: "6px 0" } }, "Binary body — " + body.contentType + " · " + formatBytes(body.sizeBytes) + ". Not captured.");
  if (body.kind === "omitted") return el("div.x-hint", { style: { padding: "6px 0" } }, "Body omitted (" + body.reason + ") — " + body.contentType + " · " + formatBytes(body.sizeBytes) + ". Size is recorded; bytes are not.");
  if (body.kind === "unavailable") return el("div.x-hint", { style: { padding: "6px 0" } }, "Body bytes were not available to capture — " + body.contentType + " · " + formatBytes(body.sizeBytes) + ".");
  if (body.kind === "multipart") {
    return el("div", { style: { background: "var(--bg3)", borderRadius: "var(--r-md)", padding: "8px", margin: "8px 0" } },
      body.parts.map((p) => el("div.x-partrow", null,
        el("div.x-partmeta", null, (p.name ? p.name + " · " : "") + p.contentType + " · " + formatBytes(p.sizeBytes)),

}

  if (!t) return null;
  return el("div.x-redacted", null, "Truncated — kept " + formatBytes(t.keptBytes) + " of " + formatBytes(t.totalBytes) + ".");
}

function bodySection(rowId, id, title, body, contentType) {
  const open = sectionOpen(rowId, id, true, bodySearchable(body));
  const out = [collapsibleTitle(rowId, id, title, open, true, bodyTypeMeta(body, contentType))];
  if (open) out.push(renderBodyContent(body, contentType));
  return out;
}

/* ── Panel shell ─────────────────────────────────────────────────────────── */

function renderDetailPanel() {

/* ── In-panel find: highlight text-node matches after render ─────────────── */

function stepDetailFind(dir) {
  const total = state.detailFind.count || 0;
  if (!total) return;
  let i = state.detailFind.index + dir;
  if (i < 0) i = total - 1;
  if (i >= total) i = 0;
  state.detailFind.index = i;
  applyDetailFind();
}

function applyDetailFind() {
  const body = document.querySelector(".x-detailbody");
  const countEl = document.getElementById("detail-find-count");
  if (!body) return;

  body.querySelectorAll("mark.x-findhit").forEach((m) => {
    const t = document.createTextNode(m.textContent);
    m.replaceWith(t);
  });
  body.normalize();

  const q = state.detailFind.open ? state.detailFind.text.trim() : "";
  if (!q) {
    state.detailFind.count = 0;
    if (countEl) countEl.textContent = "0 / 0";
    return;
  }

  const lower = q.toLowerCase();
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
    acceptNode: (n) => (n.nodeValue && n.nodeValue.toLowerCase().includes(lower) && n.parentElement && n.parentElement.offsetParent !== null)
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT,
  });
  const targets = [];
  let n;
  while ((n = walker.nextNode())) targets.push(n);

  const marks = [];
  for (const node of targets) {
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    let i = 0;
    for (;;) {
      const at = text.toLowerCase().indexOf(lower, i);
      if (at < 0) { frag.appendChild(document.createTextNode(text.slice(i))); break; }
      if (at > i) frag.appendChild(document.createTextNode(text.slice(i, at)));
      const mk = el("mark.x-findhit", null, text.slice(at, at + q.length));
      frag.appendChild(mk);
      marks.push(mk);
      i = at + q.length;
    }
    node.replaceWith(frag);
  }

  state.detailFind.count = marks.length;
  if (state.detailFind.index >= marks.length) state.detailFind.index = 0;
  if (countEl) countEl.textContent = marks.length ? (state.detailFind.index + 1) + " / " + marks.length : "0 / 0";
  const active = marks[state.detailFind.index];
  if (active) {
    active.classList.add("active");
    active.scrollIntoView({ block: "center" });
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   BOTTOM DOCK — tabs, table scrollbar, status bar
   ═════════════════════════════════════════════════════════════════════════ */

state.zoom = 1;

function dataRowCount(doc) { return doc ? doc.rows.reduce((n, r) => n + (isDataRow(r) ? 1 : 0), 0) : 0; }
function shownDataCount() { return visibleRows().reduce((n, r) => n + (isDataRow(r) ? 1 : 0), 0); }

  const doc = activeDoc();
  const cap = state.capture;

  const viewingLive = live && live.id === state.activeDocumentId;
  const total = dataRowCount(doc);

    : cap.status === "starting" ? "Starting…"

  return el("div.x-dock", null,
    el("div.x-docrow", null,
      el("div.x-docrail", null, renderTabStrip(), renderDockScrollbar()),

        : null),

    el("div.x-status", null,
      el("div.x-statusleft", null,
        el("span.x-statuspill", null, el("span", { class: "x-dot " + dotClass }), label),

            }, "View " + live.title)

        cap.proxyPort ? el("span.x-secondary", null, "Proxy on 127.0.0.1:" + cap.proxyPort) : null,
        cap.errorMessage ? el("span.x-statuserror", { title: cap.errorMessage }, cap.errorMessage) : null),

        el("span", null,

}

function renderDockScrollbar() {
  const s = tableEls.scroller;
  const max = s ? s.scrollWidth - s.clientWidth : 0;
  if (!s || max <= 1) { dockBar = null; return null; }

  const thumb = el("div.x-hbar-thumb");
  const track = el("div.x-hbar", {
    tabindex: "0", role: "scrollbar", "aria-label": "Log table horizontal scroll",
    "aria-orientation": "horizontal",
    onpointerdown: (e) => {
      const t = tableEls.scroller;
      if (!t) return;
      const trackRect = track.getBoundingClientRect();
      const thumbRect = thumb.getBoundingClientRect();
      const range = t.scrollWidth - t.clientWidth;
      const travel = Math.max(1, trackRect.width - thumbRect.width);
      // Clicking the bare track jumps the thumb's centre to the cursor first.
      let grab = e.clientX - thumbRect.left;
      if (e.target !== thumb) {
        grab = thumbRect.width / 2;
        t.scrollLeft = ((e.clientX - trackRect.left - grab) / travel) * range;
      }
      thumb.classList.add("dragging");
      const move = (ev) => {
        const x = ev.clientX - trackRect.left - grab;
        t.scrollLeft = Math.max(0, Math.min(range, (x / travel) * range));
      };
      const up = () => {
        document.removeEventListener("pointermove", move);
        document.removeEventListener("pointerup", up);
        thumb.classList.remove("dragging");
      };
      document.addEventListener("pointermove", move);
      document.addEventListener("pointerup", up);
    },
    onkeydown: (e) => {
      const t = tableEls.scroller;
      if (!t) return;
      const step = e.key === "Home" || e.key === "End" ? t.scrollWidth : 60;
      if (e.key === "ArrowLeft") { e.preventDefault(); t.scrollLeft -= step; }
      else if (e.key === "ArrowRight") { e.preventDefault(); t.scrollLeft += step; }
      else if (e.key === "Home") { e.preventDefault(); t.scrollLeft = 0; }
      else if (e.key === "End") { e.preventDefault(); t.scrollLeft = t.scrollWidth; }
    },
  }, thumb);

  dockBar = { track, thumb };
  requestAnimationFrame(syncDockScrollbar);
  return el("div.x-hscrollslot", null, track);
}

/* ── Tab strip ───────────────────────────────────────────────────────────── */

function selectDocument(id) {
  if (state.activeDocumentId === id) return;
  state.activeDocumentId = id;
  state.selectedEventId = undefined;
  state.spanZoom = false;
  state.findActiveIndex = 0;
  state.followingTail = true;
  renderAll();
}

function closeDocument(id) {
  const doc = docById(id);
  if (!doc) return;
  if (state.capture.liveDocumentId === id) { showToast("Stop the live capture first"); return; }
  const i = state.documents.findIndex((d) => d.id === id);
  state.documents = state.documents.filter((d) => d.id !== id);
  if (!state.documents.length) createDocument("capture");
  if (state.activeDocumentId === id) {
    const next = state.documents[Math.min(i, state.documents.length - 1)];
    state.activeDocumentId = next.id;
    state.selectedEventId = undefined;
  }
  tableEls.docId = null;
  renderAll();
}

/** Double-click tracking for tab rename (see the tab button's onclick). */

function renderTabStrip() {
  const list = el("div.x-tablist", { role: "tablist", "aria-label": "Capture tabs" });

    const active = doc.id === state.activeDocumentId;
    const isLive = state.capture.liveDocumentId === doc.id;
    const count = dataRowCount(doc);
    const runs = doc.runs.length;
    const tooltip = doc.title + " · Tab " + (index + 1) + " · " + count.toLocaleString() + " rows · "
      + runs.toLocaleString() + " " + (runs === 1 ? "run" : "runs");

    if (state.tabRename && state.tabRename.id === doc.id) {
      list.appendChild(el("div", { class: "x-tabshell" + (active ? " active" : "") },
        el("div.x-renamewrap", null,
          el("input.x-renameinput", {
            "data-k": "tab-rename", value: state.tabRename.value,
            oninput: (e) => { state.tabRename.value = e.target.value; },
            // Only a real user blur commits. A rebuild (streaming re-renders run
            // several times a second) tears this node out and fires blur too,
            // which would otherwise close the rename box mid-edit.
            onblur: () => { if (!isRendering) commitRename(); },
            onkeydown: (e) => {
              if (e.key === "Enter") { e.preventDefault(); commitRename(); }
              if (e.key === "Escape") { e.preventDefault(); state.tabRename = undefined; renderAll(); }
            },
          }))));
      return;
    }

    const shell = el("div", { class: "x-tabshell" + (active ? " active" : "") },
      el("button.x-tabbtn", {
        type: "button", "data-tab": doc.id, tabindex: active ? "0" : "-1",
        role: "tab", "aria-selected": String(active),
        title: tooltip,
        // Double-click is detected by timestamp rather than the dblclick event:
        // selecting a tab re-renders the strip, so the second click would land on
        // a brand-new node and dblclick would never fire.
        onclick: () => {
          const now = Date.now();
          if (lastTabClick.id === doc.id && now - lastTabClick.t < 450) {
            lastTabClick = { id: null, t: 0 };
            beginRename(doc.id);
            return;
          }
          lastTabClick = { id: doc.id, t: now };
          selectDocument(doc.id);
        },
        onauxclick: (e) => { if (e.button === 1) { e.preventDefault(); closeDocument(doc.id); } },
        oncontextmenu: (e) => { e.preventDefault(); openOverlay("tabmenu", { left: e.clientX, right: e.clientX, top: e.clientY, bottom: e.clientY, width: 0, height: 0 }, { docId: doc.id, align: "start" }); },
        onkeydown: (e) => onTabKey(e, doc),
      },
        // The emoji in an automatic title is the tab's identity, so a plain
        // capture tab carries no icon: only HAR (document), live (green record
        // dot) and error (red !) states add one.
        doc.kind === "har"
          ? el("span.x-tabicon", { html: ICON.doc })
          : doc.status === "live"
            ? el("span.x-tabicon.live", { html: ICON.record })
            : doc.status === "error"
              ? el("span.x-tabicon.err", { "aria-hidden": "true" }, "!")
              : null,
        el("span.x-tabtitle", null, doc.title),
        // The count is a background-activity hint — shown only while another tab
        // is the live one and has rows.
        isLive && !active && count > 0 ? el("span.x-tabcount", null, count.toLocaleString()) : null));
    list.appendChild(shell);
  });

  return el("div.x-tabstrip", null,
    el("div.x-tabviewport", null, list),
    attachTip(el("button", {
      class: "f-btn subtle icon-only x-tabadd", type: "button", "aria-label": "New capture tab",
      html: ICON.addSm,
      onclick: () => { const d = createDocument("capture"); selectDocument(d.id); },
    }), "New capture tab"));
}

function beginRename(id) {
  const doc = docById(id);
  if (!doc) return;
  state.tabRename = { id, value: doc.title };
  renderAll();
  requestAnimationFrame(() => {
    const input = document.querySelector('[data-k="tab-rename"]');
    if (input) { input.focus(); input.select(); }
  });
}
function commitRename() {
  const r = state.tabRename;
  if (!r) return;
  const doc = docById(r.id);
  state.tabRename = undefined;
  if (doc) {
    const v = r.value.trim();
    if (v) { doc.title = v; doc.autoTitle = false; }
    // Saving a blank name restores the tab's automatic animal title.
    else if (doc.autoName) { doc.title = doc.autoName; doc.autoTitle = true; }
  }
  renderAll();
}

function onTabKey(e, doc) {
  const i = state.documents.findIndex((d) => d.id === doc.id);
  const focusTab = (idx) => {
    const t = state.documents[idx];
    if (!t) return;
    selectDocument(t.id);
    requestAnimationFrame(() => {
      const b = document.querySelector('[data-tab="' + t.id + '"]');
      if (b) b.focus();
    });
  };
  if (e.key === "ArrowRight") { e.preventDefault(); focusTab(Math.min(i + 1, state.documents.length - 1)); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); focusTab(Math.max(i - 1, 0)); }
  else if (e.key === "Home") { e.preventDefault(); focusTab(0); }
  else if (e.key === "End") { e.preventDefault(); focusTab(state.documents.length - 1); }
  else if (e.key === "F2") { e.preventDefault(); beginRename(doc.id); }
  else if (e.key === "Delete") { e.preventDefault(); closeDocument(doc.id); }
  else if (e.key === "ContextMenu" || (e.shiftKey && e.key === "F10")) {
    e.preventDefault();
    const r = e.currentTarget.getBoundingClientRect();
    openOverlay("tabmenu", r, { docId: doc.id, align: "start" });
  }
}

OVERLAYS.tabmenu = (o) => {
  const id = o.docId;
  const i = state.documents.findIndex((d) => d.id === id);
  const m = el("div.x-menu");
  m.appendChild(menuItem("Rename…", () => { closeOverlay(); beginRename(id); }));
  m.appendChild(el("div.x-menudivider"));
  m.appendChild(menuItem("Close", () => { closeOverlay(); closeDocument(id); }));
  m.appendChild(menuItem("Close others", () => {
    closeOverlay();
    for (const d of state.documents.slice()) if (d.id !== id) closeDocument(d.id);
  }, { disabled: state.documents.length < 2 }));
  m.appendChild(menuItem("Close tabs to the right", () => {
    closeOverlay();
    for (const d of state.documents.slice(i + 1)) closeDocument(d.id);
  }, { disabled: i >= state.documents.length - 1 }));
  return m;
};

/* ═══════════════════════════════════════════════════════════════════════════
   ZOOM (emulates the Electron window zoom, for demoing on a big screen)
   ═════════════════════════════════════════════════════════════════════════ */

function setZoom(z) {
  state.zoom = Math.max(0.5, Math.min(2.5, Math.round(z * 100) / 100));
  document.documentElement.style.zoom = state.zoom === 1 ? "" : String(state.zoom);
  renderAll();
}
function nudgeZoom(dir) { setZoom(state.zoom + dir * 0.1); }

/* ═══════════════════════════════════════════════════════════════════════════
   KEYBOARD
   ═════════════════════════════════════════════════════════════════════════ */

function inTextField(t) {
  if (!t) return false;
  const tag = t.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || t.isContentEditable;
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (state.overlay) { e.preventDefault(); closeOverlay(); return; }
    if (state.detailFind.open) { e.preventDefault(); state.detailFind = { open: false, text: "", index: 0 }; renderAll(); return; }
  }

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") {
    if (selectedRow()) { e.preventDefault(); state.detailFind = { open: true, text: state.detailFind.text || "", index: 0 }; renderAll();
      requestAnimationFrame(() => { const i = document.querySelector('[data-k="detail-find"]'); if (i) i.focus(); }); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "+" || e.key === "=")) { e.preventDefault(); nudgeZoom(1); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "-") { e.preventDefault(); nudgeZoom(-1); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === "0") { e.preventDefault(); setZoom(1); return; }

  if (e.ctrlKey && e.key === "Tab") {
    e.preventDefault();
    const i = state.documents.findIndex((d) => d.id === state.activeDocumentId);
    const n = state.documents.length;
    selectDocument(state.documents[(i + (e.shiftKey ? -1 : 1) + n) % n].id);
    return;
  }
  if (e.ctrlKey && /^[1-9]$/.test(e.key)) {
    const d = state.documents[Number(e.key) - 1];
    if (d) { e.preventDefault(); selectDocument(d.id); }
    return;
  }

  if (inTextField(e.target) || e.ctrlKey || e.metaKey || e.altKey) return;

  if (e.key === "m" || e.key === "M") { e.preventDefault(); addMarker(); }
  else if (e.key === "[") { e.preventDefault(); jumpMarker(-1); }
  else if (e.key === "]") { e.preventDefault(); jumpMarker(1); }
});

window.addEventListener("wheel", (e) => {
  if (!e.ctrlKey || e.deltaY === 0) return;
  e.preventDefault();
  nudgeZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });

/* Reveal scrollbar thumbs only while a container is actively scrolling. */
document.addEventListener("scroll", (e) => {
  const t = e.target;
  if (!t || t.nodeType !== 1 || !t.classList) return;
  t.classList.add("is-scrolling");
  clearTimeout(t._srt);
  t._srt = setTimeout(() => t.classList.remove("is-scrolling"), 900);
}, { capture: true, passive: true });

window.addEventListener("resize", () => { hideTip(); renderAll(); });

/* ═══════════════════════════════════════════════════════════════════════════
   INIT
   ═════════════════════════════════════════════════════════════════════════ */

(function init() {
  const first = createDocument("capture");
  state.activeDocumentId = first.id;
  renderNow();

  // Keep the windowed list correct as the viewport changes.
  if (window.ResizeObserver) {
    const ro = new ResizeObserver(() => { if (tableEls.scroller) renderRowsOnly(); });
    ro.observe(document.getElementById("region-body"));
  }
})();

</script>
</body>
</html>
